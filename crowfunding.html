<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crowdfunding Platform</title>
  <link rel="stylesheet" href="crowfunding.css">
</head>
<body>
  <header>
    <h1>Crowdfunding Platform</h1>
    <button onclick="showCreateProjectForm()">Create a New Project</button>
  </header>
  
  <main>
    <div id="project-list"></div>
    <div id="project-form" style="display: none;">
      <h2>Create Project</h2>
      <label for="project-name">Project Name:</label>
      <input type="text" id="project-name" required><br>
      <label for="project-description">Description:</label>
      <textarea id="project-description" required></textarea><br>
      <label for="project-goal">Funding Goal ($):</label>
      <input type="number" id="project-goal" required><br>
      <button onclick="createProject()">Create Project</button>
      <button onclick="hideCreateProjectForm()">Cancel</button>
    </div>
  </main>

  <script src="crowfunding.js"></script>
</body>
</html>
